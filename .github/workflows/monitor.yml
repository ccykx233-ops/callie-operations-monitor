name: Callie operations monitor

on:
  schedule:
    # Offset from the top of the hour; GitHub can delay high-load minute 00 jobs.
    - cron: "7,17,27,37,47,57 * * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callie-operations-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MONITOR_DATABASE_URL: ${{ secrets.MONITOR_DATABASE_URL }}
      MONITOR_MODE: ${{ vars.MONITOR_MODE }}
      MONITOR_WORKER_ID: ${{ vars.MONITOR_WORKER_ID }}
      MONITOR_WORKER_INSTANCE_ID: ${{ vars.MONITOR_WORKER_INSTANCE_ID }}
      MONITOR_WORKER_CABINET_ID: ${{ vars.MONITOR_WORKER_CABINET_ID }}
      MONITOR_INTEGRATION_IDS: ${{ vars.MONITOR_INTEGRATION_IDS }}
      MONITOR_ORDER_HISTORICAL_BASELINE_AT: ${{ vars.MONITOR_ORDER_HISTORICAL_BASELINE_AT }}
      MONITOR_WORKER_CONFIRM_DELAY_SECONDS: "60"
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python callie_monitor_runner.py
